name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build dev container
        run: podman build -t munin-dev -f Dockerfile.dev .

      - name: Run tests
        run: podman run --rm --shm-size=64m munin-dev ./Build test

      - name: Run lint
        run: podman run --rm munin-dev make lint || true

      - name: Run critic
        run: podman run --rm munin-dev env TEST_CRITIC=1 ./Build test || true
